<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#182847" />
  <title>Lost Light</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css?v=14" />
</head>
<body>
  <main>
    <header>
      <h1>Lost Light</h1>
      <p>A tale of the Lantern Coast</p>
    </header>
    <div id="game-shell" aria-label="Lost Light game">
      <div id="game"></div>
    </div>
    <section class="controls" aria-label="Controls">
      <span><kbd>WASD</kbd> / <kbd>Arrows</kbd> Move</span>
      <span><kbd>Z</kbd> / <kbd>Enter</kbd> Talk</span>
      <span><kbd>X</kbd> Back</span>
      <span><kbd>I</kbd> Inventory</span>
    </section>
    <p class="status">First playable prototype · Chapter One: The Ashfang Raid</p>
  </main>
  <script>
    function showGameError(message) {
      const status = document.querySelector(".status");
      if (status) {
        status.textContent = "Game error: " + message;
        status.style.color = "#ff9b8f";
      }
    }
    window.addEventListener("error", event => showGameError(event.message || "unknown runtime error"));
    window.addEventListener("unhandledrejection", event => {
      const reason = event.reason;
      showGameError(reason && reason.message ? reason.message : String(reason || "promise rejected"));
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script src="./src/game.js?v=40"></script>
</body>
</html>
