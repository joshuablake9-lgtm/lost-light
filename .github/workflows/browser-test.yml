name: Browser Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Start local game server
        run: |
          python3 -m http.server 4173 > /tmp/lost-light-server.log 2>&1 &
          sleep 2
      - name: Run browser test
        run: |
          set +e
          npm run test:browser 2>&1 | tee smoke.log
          code=${PIPESTATUS[0]}
          {
            echo "## Browser smoke output"
            echo '~~~text'
            cat smoke.log
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lost-light-smoke
          path: lost-light-smoke.png
